name: DHH Pulse — Daily Spotify Scrape

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick update only (skip catalog discovery)"
        type: boolean
        required: false
        default: false
      artist_id:
        description: "Optional: Specific Spotify Artist ID to scrape"
        type: string
        required: false

# Required so the "Commit database snapshot" step can push.
permissions:
  contents: write

# Never run two scrapes at once — they would fight over the SQLite file.
concurrency:
  group: dhh-pulse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape DHH Artist Data
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2-hour max for 20+ artists with polite delays

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup Node.js
      # -----------------------------------------------------------------------
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 4. Restore SQLite database from cache (preserves historical data)
      # -----------------------------------------------------------------------
      - name: Restore SQLite database cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/dhh-pulse.sqlite
          key: dhh-sqlite-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dhh-sqlite-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # 5. Ensure the data directory exists
      # -----------------------------------------------------------------------
      - name: Ensure data directory
        run: mkdir -p data

      # -----------------------------------------------------------------------
      # 6. Run the scraper
      # -----------------------------------------------------------------------
      - name: Run DHH Pulse scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            ARGS="--quick"
          fi

          if [ -n "${{ github.event.inputs.artist_id }}" ]; then
            ARGS="$ARGS --artist ${{ github.event.inputs.artist_id }}"
          fi

          echo "Running: npx tsx scripts/scrape.ts $ARGS"
          npx tsx scripts/scrape.ts $ARGS
        env:
          NODE_ENV: production

      # -----------------------------------------------------------------------
      # 7. Upload SQLite database as artifact (30-day retention)
      # -----------------------------------------------------------------------
      - name: Upload SQLite database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhh-pulse-db-${{ github.run_id }}
          path: data/dhh-pulse.sqlite
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # 8. Commit updated database back to repo
      # -----------------------------------------------------------------------
      # NOTE: `data/*.sqlite` is git-ignored so local runs never dirty the tree.
      # The workflow force-adds it, which is a valid free-tier approach for a
      # small (<100MB) database. Delete this step if the DB grows large and rely
      # on the cache + artifact instead.
      - name: Commit database snapshot
        run: |
          git config --global user.name "DHH Pulse Bot"
          git config --global user.email "bot@dhh-pulse.local"

          if [ ! -f data/dhh-pulse.sqlite ]; then
            echo "No database file — skipping commit."
            exit 0
          fi

          # Force-add because data/*.sqlite is git-ignored.
          git add -f data/dhh-pulse.sqlite

          if git diff --cached --quiet -- data/dhh-pulse.sqlite; then
            echo "No database changes — skipping commit."
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail the workflow if push is blocked

      # -----------------------------------------------------------------------
      # 9. Summary
      # -----------------------------------------------------------------------
      - name: Scrape summary
        if: always()
        run: |
          echo "## Scrape Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.quick == 'true' && 'Quick Update' || 'Full Catalog Sync' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data/dhh-pulse.sqlite ]; then
            DB_SIZE=$(du -sh data/dhh-pulse.sqlite | cut -f1)
            echo "- **Database size**: $DB_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
